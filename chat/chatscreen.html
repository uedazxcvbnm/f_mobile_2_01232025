<!DOCTYPE html>
<html lang="ja">

<head>

    <title>chat</title>
    <link rel="stylesheet" href="../chat/chatscreen.css">
</head>

<body>

        <div class="header">
            <button id="back-button">&lt; 戻る</button>

                <button id="send" class="disabled-button">▻</button>
            </div>
        </div>
    </div>
    <script src="../chat/chatscreen.js"></script>
