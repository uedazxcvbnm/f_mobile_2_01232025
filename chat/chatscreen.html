<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat</title>
    <link rel="stylesheet" href="../chat/chatscreen.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <button id="back-button">&lt; 戻る</button>
            <div class="group-info">
                <span id="group-name">サンプルグループ</span>
                <span id="group-members">(5)</span>
            </div>
        </div>
        <div class="chat-area"></div>
        <div class="message-area">
            <div class="message-area-text">
                <textarea id="text"></textarea>
            </div>
            <div class="message-area-button">
                <button id="send" class="disabled-button">▻</button>
            </div>
        </div>
    </div>
    <script>document.addEventListener("DOMContentLoaded", function () {
            // 戻るボタンのクリックイベント
            document.getElementById("back-button").addEventListener("click", function () {
                // 仮の画面推移先への遷移
                window.location.href = "../joingrouplist/joingrouplist.html";
            });

            // 仮のデータ
            const groupName = "サンプルグループ";
            const groupMembers = 5;

            // HTML要素にデータをセット
            document.getElementById("group-name").textContent = groupName;
            document.getElementById("group-members").textContent = `(${groupMembers})`;

            const sendButton = document.getElementById("send");
            const textInput = document.getElementById("text");
            const chatArea = document.querySelector(".chat-area");

            // テストデータの表示（相手からのメッセージ）
            displayMessageFromOther("森田", "よろしくお願いします！");
            displayMessageFromOther("森田", "最近は禁酒に励んでいます！！");

            // 送信ボタンのクリックイベントリスナー
            sendButton.addEventListener("click", function () {
                sendMessage();
            });

            // Enterキーでメッセージを送信
            textInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault(); // 改行の挙動を防ぐ
                    sendMessage();
                }
            });

            // メッセージ送信関数
            function sendMessage() {
                const message = textInput.value.trim(); // テキストボックスの値を取得（前後の空白をトリム）

                // 空白のメッセージ
                if (message === "") {
                    displayEmptyMessage();
                } else {
                    displayMessage(message, "sent");
                }

                // テキストボックスをクリアする
                textInput.value = "";

                // チャットエリアを一番下までスクロールする
                scrollToBottom();
            }

            // 空白のメッセージを表示する関数
            function displayEmptyMessage() {
                const messageContainer = document.createElement("div");
                messageContainer.classList.add("message-container");

                const messageElement = document.createElement("div");
                messageElement.classList.add("message", "empty");
                messageElement.textContent = "\u00A0".repeat(20);//空白時テキスト

                messageContainer.appendChild(messageElement);
                chatArea.appendChild(messageContainer);

                // チャットエリアを一番下までスクロール
                scrollToBottom();
            }

            // メッセージを表示する関数
            function displayMessage(message, type) {
                const messageContainer = document.createElement("div");
                messageContainer.classList.add("message-container");

                const messageElement = document.createElement("div");
                messageElement.classList.add("message", type);
                messageElement.innerHTML = message.replace(/\n/g, "<br>"); // 改行を <br> タグに置換して表示

                messageContainer.appendChild(messageElement);
                chatArea.appendChild(messageContainer);

                // チャットエリアを一番下までスクロール
                scrollToBottom();
            }

            // 相手からのメッセージを表示する関数
            function displayMessageFromOther(name, message) {
                const messageContainer = document.createElement("div");
                messageContainer.classList.add("message-container", "received");

                const iconElement = document.createElement("div");
                iconElement.classList.add("icon");

                const messageElement = document.createElement("div");
                messageElement.classList.add("message");

                const nameElement = document.createElement("div");
                nameElement.classList.add("message-name");
                nameElement.textContent = name;

                messageElement.appendChild(nameElement);
                messageElement.innerHTML += message.replace(/\n/g, "<br>"); // 改行を <br> タグに置換して表示

                messageContainer.appendChild(iconElement);
                messageContainer.appendChild(messageElement);
                chatArea.appendChild(messageContainer);

                // チャットエリアを一番下までスクロールする
                scrollToBottom();
            }

            // チャットエリアを一番下までスクロールする関数
            function scrollToBottom() {
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        });
    </script>
</body>

</html>
